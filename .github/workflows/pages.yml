name: Deploy to GitHub Pages

# The app is static — no build step. This publishes the repo root as-is, so
# whatever is on main is what the site serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kept separate and free of an `environment:` block on purpose. The
  # github-pages environment is only grantable once the repository's Pages
  # source is "GitHub Actions"; a job that declares it while the source is
  # still branch-based is rejected before its first step runs. So the switch
  # has to happen in a job that does not declare the environment.
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    needs: configure
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
