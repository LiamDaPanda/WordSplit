<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WordSplit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="Break SSAT vocabulary into prefixes, roots, and suffixes, then study it.">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordSplit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Icon set. Drawn as strokes on a 24x24 grid and inherited via
     currentColor, so every icon picks up the theme and the active tab tint
     instead of the flat grey that emoji were being filtered to. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-split" viewBox="0 0 24 24">
    <path d="M6 4v5a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v5" />
    <path d="M6 20v-5a3 3 0 0 1 3-3" />
    <circle cx="6" cy="3.6" r="1.9" /><circle cx="6" cy="20.4" r="1.9" />
    <circle cx="18" cy="20.4" r="1.9" />
  </symbol>
  <symbol id="i-study" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="4.6" />
    <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none" />
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24">
    <path d="M7.5 8.5h9a4.5 4.5 0 0 1 4.4 3.6l.7 3.6a2.6 2.6 0 0 1-4.7 2l-1.2-1.8H8.3l-1.2 1.8a2.6 2.6 0 0 1-4.7-2l.7-3.6A4.5 4.5 0 0 1 7.5 8.5Z" />
    <path d="M7.2 12.6h2.4M8.4 11.4v2.4M15.4 12.2h.01M17.4 13.8h.01" />
  </symbol>
  <symbol id="i-words" viewBox="0 0 24 24">
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v14.5H6.5A2.5 2.5 0 0 0 4 20V5.5Z" />
    <path d="M4 20a2.5 2.5 0 0 1 2.5-2.5H19V21H6.5A2.5 2.5 0 0 1 4 20Z" />
    <path d="M8.5 7.5h6M8.5 11h4" />
  </symbol>
  <symbol id="i-roots" viewBox="0 0 24 24">
    <path d="M12 21v-8" />
    <path d="M12 13c0-3.3 2.4-6 5.5-6.4C17.2 9.9 15 13 12 13Z" />
    <path d="M12 15c-2.8 0-5-2.6-5.3-5.6C9.6 9.8 12 12 12 15Z" />
    <path d="M9.5 21h5" />
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3.2" />
    <path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5" />
  </symbol>

  <!-- study modes and games -->
  <symbol id="i-cards" viewBox="0 0 24 24">
    <rect x="8.5" y="4" width="11" height="15" rx="2.4" />
    <path d="M5.6 6.8A2.4 2.4 0 0 0 4.5 8.8v8.8A2.4 2.4 0 0 0 6.9 20h7.6" />
  </symbol>
  <symbol id="i-letters" viewBox="0 0 24 24">
    <path d="M3.8 17 8 7l4.2 10M5.3 13.6h5.4" />
    <path d="M20.2 11.6a2.9 2.9 0 0 0-5.6 1M14.6 14.4a2.9 2.9 0 0 0 5.6.9v-3.7" />
  </symbol>
  <symbol id="i-puzzle" viewBox="0 0 24 24">
    <path d="M10.4 3.5h3.2v2a1.7 1.7 0 1 0 3.4 0v-2h3v3.2h-2a1.7 1.7 0 1 0 0 3.4h2v3.2h-3.2v-2a1.7 1.7 0 1 0-3.4 0v2H10.4v-3.2h-2a1.7 1.7 0 1 1 0-3.4h2Z" />
    <path d="M10.4 13.5v7H3.6v-7" />
  </symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24">
    <rect x="2.6" y="6" width="18.8" height="12" rx="2.4" />
    <path d="M6.6 9.6h.01M10 9.6h.01M13.4 9.6h.01M16.8 9.6h.01M6.6 12.8h.01M10 12.8h.01M13.4 12.8h.01M16.8 12.8h.01M8.4 15.6h7.2" />
  </symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24">
    <path d="M4 9.5A6 6 0 0 1 9.8 5h8.4M18.2 5l-2.6-2.6M18.2 5l-2.6 2.6" />
    <path d="M20 14.5A6 6 0 0 1 14.2 19H5.8M5.8 19l2.6 2.6M5.8 19l2.6-2.6" />
  </symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24">
    <path d="M13.2 2.6 5 13.4h5.6L9.9 21.4 18.6 10.4H12.6Z" />
  </symbol>
  <symbol id="i-blocks" viewBox="0 0 24 24">
    <rect x="3" y="13.4" width="7.6" height="7.6" rx="1.8" />
    <rect x="13.4" y="13.4" width="7.6" height="7.6" rx="1.8" />
    <rect x="8.2" y="3" width="7.6" height="7.6" rx="1.8" />
  </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24">
    <path d="M12 20.4S3.4 15.3 3.4 9.3a4.7 4.7 0 0 1 8.6-2.6 4.7 4.7 0 0 1 8.6 2.6c0 6-8.6 11.1-8.6 11.1Z" />
  </symbol>

  <!-- status and action glyphs, replacing the emoji these used to be -->
  <symbol id="i-shuffle" viewBox="0 0 24 24">
    <path d="M3 6.5h3.4a4 4 0 0 1 3.3 1.8l4.6 7.4a4 4 0 0 0 3.3 1.8H21" />
    <path d="M3 17.5h3.4a4 4 0 0 0 3.3-1.8l.9-1.5M14 9.3l.3-.5a4 4 0 0 1 3.3-1.8H21" />
    <path d="M18.6 4.4 21 6.5l-2.4 2.1M18.6 15.4 21 17.5l-2.4 2.1" />
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="m4.8 12.6 4.6 4.6L19.2 7.4" />
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24">
    <path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6" />
  </symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24">
    <path d="M7 3.6h10v5a5 5 0 0 1-10 0v-5Z" />
    <path d="M7 5.4H4.4v1.4A3.4 3.4 0 0 0 7.4 10M17 5.4h2.6v1.4A3.4 3.4 0 0 1 16.6 10" />
    <path d="M12 13.6v3.2M8.4 20.4h7.2l-.7-3.6H9.1Z" />
  </symbol>
  <symbol id="i-flame" viewBox="0 0 24 24">
    <path d="M12.6 2.6c.6 3.2-1.4 4.4-2.8 6C8.2 10.5 7 11.9 7 14.2a5 5 0 0 0 10 0c0-2.4-1-3.7-2-5.2-.5 1.1-1.2 1.7-2 2 .6-3-.4-6.6-.4-8.4Z" />
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="10.8" cy="10.8" r="6.6" /><path d="m15.6 15.6 4.4 4.4" />
  </symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24">
    <path d="M4 9.4h3.2L12 5.4v13.2L7.2 14.6H4Z" />
    <path d="M15.6 9.6a3.4 3.4 0 0 1 0 4.8M18.2 7a7 7 0 0 1 0 10" />
  </symbol>
</svg>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brandMark" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1 id="viewTitle">WordSplit</h1>
    </div>
    <div class="streak" id="streakChip" hidden></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-view="split" aria-label="Split">
      <svg class="tabIcon" aria-hidden="true"><use href="#i-split"/></svg>
      <span class="tabLabel">Split</span>
    </button>
    <button class="tab" data-view="study" aria-label="Study">
      <svg class="tabIcon" aria-hidden="true"><use href="#i-study"/></svg>
      <span class="tabLabel">Study</span>
    </button>
    <button class="tab" data-view="play" aria-label="Play">
      <svg class="tabIcon" aria-hidden="true"><use href="#i-play"/></svg>
      <span class="tabLabel">Play</span>
    </button>
    <button class="tab" data-view="browse" aria-label="Words">
      <svg class="tabIcon" aria-hidden="true"><use href="#i-words"/></svg>
      <span class="tabLabel">Words</span>
    </button>
    <button class="tab" data-view="roots" aria-label="Roots">
      <svg class="tabIcon" aria-hidden="true"><use href="#i-roots"/></svg>
      <span class="tabLabel">Roots</span>
    </button>
    <button class="tab" data-view="settings" aria-label="Settings">
      <svg class="tabIcon" aria-hidden="true"><use href="#i-settings"/></svg>
      <span class="tabLabel">Settings</span>
    </button>
  </nav>
</div>

<script src="js/morphemes.js"></script>
<script src="js/splitter.js"></script>
<script src="js/weights.js"></script>
<script src="js/data/core.js"></script>
<script src="js/data/ssat.js"></script>
<script src="js/learn.js"></script>
<script src="js/store.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
