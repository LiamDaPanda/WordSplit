<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WordSplit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="Break SSAT and SAT vocabulary into prefixes, roots, and suffixes, then study it.">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordSplit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <h1 id="viewTitle">WordSplit</h1>
    <div class="streak" id="streakChip" hidden></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-view="split" aria-label="Split">
      <span class="tabIcon">✂️</span><span class="tabLabel">Split</span>
    </button>
    <button class="tab" data-view="study" aria-label="Study">
      <span class="tabIcon">🎯</span><span class="tabLabel">Study</span>
    </button>
    <button class="tab" data-view="browse" aria-label="Words">
      <span class="tabIcon">📚</span><span class="tabLabel">Words</span>
    </button>
    <button class="tab" data-view="roots" aria-label="Roots">
      <span class="tabIcon">🌱</span><span class="tabLabel">Roots</span>
    </button>
    <button class="tab" data-view="settings" aria-label="Settings">
      <span class="tabIcon">⚙️</span><span class="tabLabel">Settings</span>
    </button>
  </nav>
</div>

<script src="js/morphemes.js"></script>
<script src="js/splitter.js"></script>
<script src="js/data/ssat.js"></script>
<script src="js/data/sat.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
